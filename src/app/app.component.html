<div class="app-shell">
  <header class="app-topbar" data-testid="app-topbar">
    <div class="brand-group" (click)="returnToDashboard()" role="button" tabindex="0">
      <div class="brand-logo" aria-hidden="true">✦</div>
      <div>
        <h1 class="brand-title">Selah Memory</h1>
        <p class="brand-subtitle">Voice-Recitation &amp; First-Letter Scripture SRS</p>
      </div>
    </div>

    <nav class="topbar-actions">
      <button
        type="button"
        class="topbar-btn"
        [class.active]="activeView() === 'dashboard'"
        (click)="returnToDashboard()"
        data-testid="nav-dashboard"
      >
        Deck ({{ storageService.stats().total }})
      </button>
      <button
        type="button"
        class="topbar-btn"
        [class.active]="activeView() === 'study'"
        (click)="startDueSession()"
        data-testid="nav-study"
      >
        Study Due ({{ storageService.stats().due }})
      </button>
      <button
        type="button"
        class="topbar-btn accent"
        (click)="showAddPassageModal.set(true)"
        data-testid="nav-add-passage"
      >
        + Copy-Paste Text
      </button>
      <button
        type="button"
        class="topbar-btn subtle"
        (click)="showProtoSyncModal.set(true)"
        data-testid="nav-proto-sync"
      >
        ProtoJSON
      </button>
    </nav>
  </header>

  <main class="app-main">
    @if (activeView() === 'dashboard') {
      <app-deck-dashboard
        (startDueSession)="startDueSession()"
        (practiceSingleItem)="practiceSingleItem($event)"
        (openAddPassage)="showAddPassageModal.set(true)"
        (openProtoSync)="showProtoSyncModal.set(true)"
      />
    } @else {
      @if (currentStudyItem(); as item) {
        <app-study-card
          [item]="item"
          [queuePosition]="currentQueueIndex() + 1"
          [queueTotal]="studyQueueIds().length"
          (rated)="onCardRated($event)"
          (backToDeck)="returnToDashboard()"
        />
      } @else {
        <div class="empty-study-state" data-testid="empty-study-state">
          <h2>Session Complete!</h2>
          <p>All cards in this session have been reviewed.</p>
          <button type="button" class="primary-btn" (click)="returnToDashboard()">
            Back to Deck Dashboard
          </button>
        </div>
      }
    }
  </main>

  @if (showAddPassageModal()) {
    <app-add-passage-modal
      (closed)="showAddPassageModal.set(false)"
      (passageAdded)="onPassageAdded($event)"
    />
  }

  @if (showProtoSyncModal()) {
    <app-proto-sync-modal (closed)="showProtoSyncModal.set(false)" />
  }
</div>
